name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --extra dev --no-install-project

      - name: Lint with ruff
        run: uv run --no-project ruff check .

      - name: Check formatting
        run: uv run --no-project ruff format --check .

      - name: Type check with mypy
        run: uv run --no-project mypy modules/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: uv sync --extra ci --no-install-project

      # No enumerar módulos aquí: un módulo nuevo debe entrar en CI sin tocar
      # este fichero. Enumerarlos dejó los módulos 15-20 (381 tests) sin cubrir.
      - name: Run tests (todos los módulos, sin API key)
        run: |
          uv run --no-project pytest modules/ \
            -m "not slow and not redteam" \
            --tb=short \
            -q \
            --cov=modules \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=90
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .pytest_cache/
          retention-days: 7
